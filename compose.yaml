# Redis for the response cache, plus Prometheus and Grafana for metrics.
# Everything listens on localhost only. See README "Observability".
services:
  redis:
    image: redis:8.2.1
    # Append-only persistence keeps the cache across restarts. Entries
    # expire after CACHE_TTL; past maxmemory the least recently used
    # entries are evicted first.
    command: >-
      redis-server --appendonly yes
      --maxmemory 1gb --maxmemory-policy volatile-lru
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - 127.0.0.1:3001:3000
    environment:
      # Local only, so skip the login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: >-
        /var/lib/grafana/dashboards/inference.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
